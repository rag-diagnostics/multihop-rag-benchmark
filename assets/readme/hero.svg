<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Where does multi-hop reasoning break?</title>
<desc id="hero-desc">A visual interpretation of a four-hop chain embedded in an eleven-document fixed context, with four gold passages among distractors.</desc>
